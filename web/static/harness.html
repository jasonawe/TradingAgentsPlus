<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>理财通用 Agent · P8 Harness</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tradingagents-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/static/styles.css?v=20260911-styles-1" />
    <link rel="stylesheet" href="/static/agent.css?v=20260924-agent-10" />
  </head>
  <body class="is-harness-view">
    <!-- Minimal harness-only page. No global app sidebar / topbar /
         other views — those live in index.html. -->
    <section id="harness-view" class="view" aria-labelledby="harness-title">
        <h1 id="harness-title" class="visually-hidden" data-i18n="harness.title">理财通用 Agent (P8)</h1>

        <!-- Harness layout: 3-column grid (sidebar | chat | inspector).
             Replaces the old toolbar-over-chat layout. -->
        <div class="harness-layout">

          <!-- ── Left: Session list ── -->
          <aside class="harness-sidebar" aria-label="会话列表">
            <button type="button" id="harness-sidebar-toggle" class="harness-sidebar-toggle" title="展开/收起会话列表" aria-label="展开/收起会话列表">›</button>
            <div class="harness-sidebar-rail" aria-hidden="false">
              <button type="button" id="harness-rail-new" class="harness-sidebar-rail-btn" data-tip="新对话" title="新对话" aria-label="新对话">
                <svg width="16" height="16" aria-hidden="true"><use href="#i-plus"/></svg>
              </button>
              <button type="button" id="harness-rail-expand" class="harness-sidebar-rail-btn" data-tip="展开会话列表" title="展开会话列表" aria-label="展开会话列表">
                <svg width="16" height="16" aria-hidden="true"><use href="#i-menu"/></svg>
              </button>
              <span class="harness-sidebar-rail-divider"></span>
              <span id="harness-rail-count" class="harness-sidebar-rail-count" data-tip="会话总数">0</span>
              <span id="harness-rail-active-title" class="harness-sidebar-rail-active" data-tip="" title="" aria-hidden="true"></span>
            </div>
            <div class="harness-sidebar-header">
              <button type="button" id="harness-new-session-btn" class="harness-new-chat-btn" title="新建会话">
                <svg width="14" height="14" aria-hidden="true"><use href="#i-plus"/></svg>
                <span>新对话</span>
              </button>
            </div>
            <div class="harness-sidebar-search">
              <svg width="14" height="14" aria-hidden="true" class="harness-sidebar-search-icon"><use href="#i-search"/></svg>
              <input type="search" id="harness-session-search" placeholder="搜索会话" aria-label="搜索会话" />
            </div>
            <nav id="harness-session-list" class="harness-session-list" aria-label="活动会话"></nav>
            <div class="harness-sidebar-footer">
              <label class="harness-grant-all" title="开启后所有写操作自动放行,关闭后恢复逐条审批">
                <input type="checkbox" id="harness-grant-all" />
                <span>全权限</span>
              </label>
            </div>
          </aside>

          <!-- ── Center: Chat ── -->
          <main class="harness-main">
            <header class="harness-main-header">
              <div class="harness-main-title">
                <strong id="harness-current-title">新对话</strong>
                <div class="harness-current-meta">
                  <span class="harness-current-dot"></span>
                  <span id="harness-current-sub">LLM + 6 agents · L3 judge</span>
                </div>
              </div>
              <div class="harness-main-actions">
                <button type="button" id="harness-inspector-toggle" class="harness-icon-btn" title="切换侧边检查器" aria-label="切换侧边检查器">
                  <svg width="16" height="16" aria-hidden="true"><use href="#i-search"/></svg>
                </button>
                <span class="harness-action-divider"></span>
                <button type="button" id="harness-fork-session-btn" class="text-button" title="Fork 会话(继承 L3 上下文)">
                  <svg width="13" height="13" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"><use href="#i-plus"/></svg>fork
                </button>
                <button type="button" id="harness-clear-btn" class="text-button" title="清空当前会话的对话历史">
                  <svg width="13" height="13" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"><use href="#i-refresh"/></svg>清空
                </button>
                <button type="button" id="harness-delete-session-btn" class="text-button" data-variant="danger" title="删除当前会话">
                  <svg width="13" height="13" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"><use href="#i-x-close"/></svg>删除
                </button>
              </div>
            </header>
            <!-- 隐藏的 session select 保留以兼容 harness.js 既有逻辑(渲染时不使用,只复用 state) -->
            <select id="harness-session-select" hidden></select>
            <div id="harness-messages" class="harness-messages" aria-live="polite"></div>
            <!-- §0.4.33.3 — persistent collapsible todo dock.
                 Sits between messages and the input form so it stays
                 in view while the user reads/scrolls. Width aligns with
                 the input box. The dock auto-hides when no plan is in
                 flight; collapses via <details> summary. -->
            <details id="harness-todo-dock" class="harness-todo-dock" hidden>
              <summary class="harness-todo-dock-summary">
                <span class="harness-todo-dock-icon">📋</span>
                <span class="harness-todo-dock-title">执行计划</span>
                <span class="harness-todo-dock-progress" data-bind="progress">0 / 0</span>
                <span class="harness-todo-dock-chevron" aria-hidden="true">▾</span>
              </summary>
              <div class="harness-todo-dock-body" data-bind="body">
                <!-- injected by renderTodoList -->
              </div>
            </details>
            <form id="harness-form" class="harness-form" autocomplete="off">
              <textarea id="harness-input" rows="3" data-i18n-placeholder="harness.placeholder" placeholder="例:深度分析 600036.SS 估值,或对比 600036 / 600000"></textarea>
              <button type="submit" id="harness-send-btn" class="btn btn-primary" data-i18n="actions.send">
                <svg width="16" height="16" aria-hidden="true"><use href="#i-plus"/></svg>
              </button>
            </form>
          </main>

          <!-- ── Right: Inspector ── -->
          <aside class="harness-inspector" aria-label="检查器">
            <div class="harness-inspector-tabs">
              <button type="button" class="harness-inspector-tab is-active" data-tab="workflow">工作流</button>
              <button type="button" class="harness-inspector-tab" data-tab="events">事件</button>
            </div>
            <div class="harness-inspector-body" id="harness-inspector-body">
              <div class="harness-inspector-pane is-active" data-pane="workflow">
                <div class="harness-inspector-empty" id="harness-workflow-empty">
                  <div class="harness-inspector-empty-icon">⌘</div>
                  <div style="font-weight:600;color:var(--ink-2);margin-bottom:6px;">工作流</div>
                  <div>每个 turn 完成后,这里会渲染分类 → 计划 → 执行 → 综合 的执行链路。</div>
                  <div style="margin-top:14px;font-size:0.74rem;opacity:0.7;">试试发条消息开始?</div>
                </div>
              </div>
              <div class="harness-inspector-pane" data-pane="events">
                <div class="harness-inspector-empty" id="harness-events-empty">
                  <div class="harness-inspector-empty-icon">⚡</div>
                  <div style="font-weight:600;color:var(--ink-2);margin-bottom:6px;">事件流</div>
                  <div>工具调用、L3 judge 决策、审批门控都会实时出现在这里。</div>
                </div>
                <ul class="harness-event-feed" id="harness-event-feed"></ul>
              </div>
            </div>
          </aside>
        </div>
      </section>

    <script>
      // Stub the cross-page hooks that harness.js (and other modules)
      // expect on the global app page. The harness view doesn't need
      // them but several helpers guard against undefined.
      window.__TA_MODULES__ = {};
      window.TradingAgentsApp = {
        navigate: function (v) {
          if (v === "harness") return; // already here
          window.location.href = v === "setup" ? "/" : "/" + v;
        },
        setRoute: function () {},
        applyRoute: function () {},
        openFormModal: function () {},
        openConfirmModal: function () {},
      };
      // Notify the parent window that we're on /harness so the
      // caller can highlight the right nav item.
      try { window.parent.postMessage({ type: "ta-route", view: "harness" }, "*"); } catch (_) {}
    </script>
    <script src="/static/harness.js?v=20260924-harness-todo-dock-0.4.33.3" defer></script>
    <script>
      // Minimal page bootstrap — call TradingAgentsHarness.init() once
      // the harness module is available. The page doesn't have the
      // full app.js so we drive init() directly.
      function bootHarness() {
        if (window.TradingAgentsHarness && typeof window.TradingAgentsHarness.init === "function") {
          window.TradingAgentsHarness.init();
          // Reflect the harness state up to any opener window so the
          // global nav (if embedded) can highlight the active item.
          try { window.opener && window.opener.postMessage({ type: "ta-route", view: "harness" }, "*"); } catch (_) {}
          return;
        }
        // harness.js still loading — retry shortly.
        setTimeout(bootHarness, 30);
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bootHarness);
      } else {
        bootHarness();
      }
    </script>
